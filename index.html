<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090c"><title>JARVIS</title>
<style>
:root{--a:#7be0ff;--b:#b69cff;--m:#8794a0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07090c;color:#f2f5f7;font-family:-apple-system,"SF Pro Display",sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(60% 40% at 15% 0,#7be0ff22,transparent),radial-gradient(60% 40% at 95% 100%,#b69cff22,transparent)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{position:relative;height:100%;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 22px calc(16px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:6px;color:#9aa7b0}
header button{margin-left:auto;letter-spacing:2px;color:var(--m)}
#dot{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 12px var(--a)}
main{margin-top:5vh}
#time{font-size:78px;font-weight:100;line-height:1;letter-spacing:1px}
#date{margin-top:8px;color:var(--m);font-size:14px;text-transform:capitalize}
#wv{width:100%;height:76px;margin-top:auto}
#st{font-size:10px;letter-spacing:5px;color:var(--m);text-align:center;margin:4px 0 14px}
#me{color:#7d8994;font-size:15px;min-height:20px;text-align:center}
#out{font-size:22px;font-weight:300;line-height:1.4;text-align:center;min-height:92px;max-height:28vh;overflow:auto;margin-top:8px}
#out.f{animation:fd .6s}@keyframes fd{from{opacity:0;transform:translateY(8px)}}
footer{display:flex;gap:8px;align-items:center;margin-top:12px;padding:7px;border-radius:30px;background:#ffffff0d;border:1px solid #ffffff17;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
footer input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font-size:16px;padding:8px}
.ic{width:42px;height:42px;border-radius:50%;background:#ffffff10;font-size:18px;display:grid;place-items:center;flex:none}
.ic.on{background:linear-gradient(135deg,var(--a),var(--b));color:#07090c}
.ov{position:fixed;inset:0;z-index:9;background:#07090cf5;display:none;overflow:auto;padding:calc(26px + env(safe-area-inset-top)) 24px 40px}
.ov.on{display:block}
#splash.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
#splash h1{margin:0;font-weight:100;font-size:44px;letter-spacing:12px}
#splash p{margin:0;color:var(--m)}
#go,.save{background:linear-gradient(135deg,var(--a),var(--b));color:#07090c;border-radius:26px;padding:15px 34px;font-weight:600}
.save{width:100%;margin-top:18px}
.ov h2{margin:0 0 4px;font-weight:300;display:flex;justify-content:space-between}
.ov label{display:block;margin:16px 0 6px;font-size:12px;color:var(--m)}
.ov input[type=text],.ov input[type=password],.ov select{width:100%;height:46px;border-radius:14px;border:1px solid #ffffff1c;background:#ffffff0a;color:#fff;padding:0 14px;font-size:16px}
.ov input[type=range]{width:100%}
.pill{border:1px solid #ffffff22;border-radius:18px;padding:9px 14px;font-size:13px;margin:10px 8px 0 0}
.hint{font-size:12px;line-height:1.5;color:var(--m)}
#camov{background:#000;padding:0}
#camov.on{display:flex;flex-direction:column}
#camov video,#camov img{flex:1;min-height:0;width:100%;object-fit:cover}
#chint{text-align:center;font-size:12px;color:var(--m);padding:8px}
.camb{display:flex;justify-content:space-around;align-items:center;padding:6px 10px calc(16px + env(safe-area-inset-bottom))}
.snap{width:62px;height:62px;border-radius:50%;border:4px solid #fff}
</style></head>
<body data-s="idle"><div class="bg"></div>
<div id="app">
<header><i id="dot"></i><span>JARVIS</span><button id="bset">•••</button></header>
<main><div id="time">--:--</div><div id="date"></div></main>
<canvas id="wv"></canvas><div id="st">PRONTO</div><div id="me"></div><div id="out"></div>
<footer><button class="ic" id="bcam">📷</button><input id="txt" placeholder="Escreva ou fale…" enterkeyhint="send" autocomplete="off"><button class="ic on" id="bmic">🎙</button></footer>
</div>

<div class="ov on" id="splash"><h1>JARVIS</h1><p>Seu assistente pessoal</p><button id="go">Toque para ativar</button></div>

<div class="ov" id="ov"><h2>Ajustes <button id="sclose">✕</button></h2>
<label>Seu nome</label><input id="name" type="text">
<label>Chave Gemini</label><input id="key" type="password" autocomplete="off">
<label>Voz (♂ = masculina)</label><select id="vsel"></select>
<button class="pill" id="gb">🎩 Jarvis britânico</button><button class="pill" id="vtest">🔊 Testar voz</button>
<label>Velocidade</label><input id="rate" type="range" min=".5" max="1.5" step=".05">
<label>Tom (grave ↔ agudo)</label><input id="pitch" type="range" min=".4" max="1.5" step=".05">
<label><input id="wake" type="checkbox"> Só responder quando eu disser "Jarvis"</label>
<button class="save" id="save">Salvar</button>
<p class="hint">Mais vozes: Ajustes do iPhone › Acessibilidade › Conteúdo Falado › Vozes. Sem som? Tire do silencioso.</p></div>

<div class="ov" id="camov"><video id="vid" playsinline autoplay muted></video><img id="shot" hidden alt="">
<div id="chint"></div>
<div class="camb"><button class="ic" id="cflip">⟲</button><button class="snap" id="csnap"></button><button class="ic" id="cai">👁</button><label class="ic">📱<input id="file" type="file" accept="image/*" capture="environment" hidden></label><button class="ic" id="cclose">✕</button></div></div>

<script src="app2.js"></script></body></html>
