<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02070b">
<title>JARVIS</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#02070b;
  color:#dffcff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh;
  overflow:hidden;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:20px;
}

.top{
  position:absolute;
  top:22px;
  left:22px;
  right:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  font-size:13px;
  letter-spacing:5px;
  opacity:.7;
}

.gear{
  border:1px solid rgba(120,240,255,.25);
  background:rgba(0,30,40,.4);
  color:#aef7ff;
  width:42px;
  height:42px;
  border-radius:50%;
  font-size:20px;
}

.clock{
  position:absolute;
  top:70px;
  text-align:center;
}

.time{
  font-size:34px;
  font-weight:300;
  letter-spacing:3px;
}

.date{
  font-size:12px;
  opacity:.5;
  margin-top:4px;
}

.orb{
  width:230px;
  height:230px;
  border-radius:50%;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:20px;
}

.orb::before,
.orb::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  border:1px solid rgba(80,230,255,.35);
  box-shadow:
    0 0 25px rgba(0,220,255,.2),
    inset 0 0 35px rgba(0,220,255,.1);
}

.orb::after{
  inset:18px;
  border-color:rgba(120,245,255,.55);
  animation:spin 8s linear infinite;
}

.core{
  width:105px;
  height:105px;
  border-radius:50%;
  background:radial-gradient(circle,#eaffff 0%,#66edff 12%,#0798bd 38%,#013a4b 65%,transparent 72%);
  box-shadow:
    0 0 20px #5beeff,
    0 0 60px rgba(0,220,255,.5);
  animation:pulse 2.5s ease-in-out infinite;
}

.listening .core{
  animation:pulse .8s ease-in-out infinite;
  box-shadow:
    0 0 30px #8fffff,
    0 0 90px rgba(0,230,255,.8);
}

@keyframes pulse{
  0%,100%{transform:scale(.9)}
  50%{transform:scale(1.08)}
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.status{
  margin-top:30px;
  font-size:12px;
  letter-spacing:3px;
  text-transform:uppercase;
  opacity:.65;
}

.output{
  margin-top:18px;
  width:min(650px,92vw);
  min-height:55px;
  text-align:center;
  font-size:17px;
  line-height:1.5;
  color:#e9feff;
}

.controls{
  position:absolute;
  bottom:25px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
}

.control{
  border:1px solid rgba(100,230,255,.25);
  background:rgba(0,30,40,.55);
  color:#c9fbff;
  padding:11px 15px;
  border-radius:22px;
}

.control:active{
  transform:scale(.96);
}

.panel{
  position:fixed;
  inset:0;
  background:rgba(0,5,8,.86);
  backdrop-filter:blur(15px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:10;
}

.panel.show{
  display:flex;
}

.card{
  width:min(480px,94vw);
  background:#07151b;
  border:1px solid rgba(110,230,255,.25);
  border-radius:22px;
  padding:22px;
  box-shadow:0 0 60px rgba(0,200,255,.15);
}

.card h2{
  margin-bottom:18px;
  font-size:20px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-size:12px;
  opacity:.65;
  margin-bottom:6px;
}

.field input{
  width:100%;
  border:1px solid rgba(120,230,255,.2);
  background:#020a0e;
  color:white;
  padding:12px;
  border-radius:12px;
  outline:none;
}

.row{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.row button{
  flex:1;
  padding:12px;
  border-radius:12px;
  border:1px solid rgba(120,230,255,.25);
  background:#0b252e;
  color:#d9fcff;
}

.close{
  background:#152027!important;
}

.small{
  font-size:11px;
  opacity:.5;
  line-height:1.5;
  margin-top:12px;
}
</style>
</head>

<body>

<div id="app">

  <div class="top">
    <div class="brand">J.A.R.V.I.S.</div>
    <button class="gear" id="settingsBtn">⚙️</button>
  </div>

  <div class="clock">
    <div class="time" id="time">00:00</div>
    <div class="date" id="date">---</div>
  </div>

  <div class="orb" id="orb">
    <div class="core"></div>
  </div>

  <div class="status" id="status">SISTEMA PRONTO</div>

  <div class="output" id="output">
    Aguardando comando.
  </div>

  <div class="controls">
    <button class="control" id="listenBtn">🎙️ Falar</button>
    <button class="control" id="voiceBtn">🔊 Testar voz</button>
    <button class="control" id="stopBtn">⏹️ Parar</button>
  </div>

</div>

<div class="panel" id="panel">
  <div class="card">

    <h2>⚙️ Configuração do JARVIS</h2>

    <div class="field">
      <label>Chave da API Gemini</label>
      <input id="apiKey" type="password" placeholder="Cole sua chave aqui">
    </div>

    <div class="field">
      <label>Nome do usuário</label>
      <input id="userName" type="text" placeholder="Seu nome">
    </div>

    <div class="row">
      <button id="saveBtn">Salvar</button>
      <button class="close" id="closeBtn">Fechar</button>
    </div>

    <div class="small">
      A voz é feita pelo sistema de fala do navegador/iPhone. 
      O JARVIS foi configurado para falar em português brasileiro com estilo calmo, elegante e tecnológico.
    </div>

  </div>
</div>

<script>
/* =========================
   CONFIGURAÇÃO
========================= */

const $ = id => document.getElementById(id);

const state = {
  apiKey: localStorage.getItem("jv_key") || "",
  userName: localStorage.getItem("jv_name") || "",
  listening: false,
  speaking: false
};


/* =========================
   RELÓGIO
========================= */

function updateClock(){
  const now = new Date();

  $("time").textContent =
    now.toLocaleTimeString("pt-BR",{
      hour:"2-digit",
      minute:"2-digit"
    });

  $("date").textContent =
    now.toLocaleDateString("pt-BR",{
      weekday:"long",
      day:"2-digit",
      month:"long"
    });
}

setInterval(updateClock,1000);
updateClock();


/* =========================
   VOZ DO JARVIS
========================= */

let voices = [];

function loadVoices(){
  voices = window.speechSynthesis
    ? window.speechSynthesis.getVoices()
    : [];
}

loadVoices();

if("speechSynthesis" in window){
  speechSynthesis.onvoiceschanged = loadVoices;
}

function getBrazilVoice(){

  loadVoices();

  const ptBR = voices.filter(v =>
    (v.lang || "").toLowerCase() === "pt-br"
  );

  if(!ptBR.length){
    return voices.find(v =>
      (v.lang || "").toLowerCase().startsWith("pt")
    );
  }

  /*
    Priorizamos vozes masculinas pelo nome quando
    o sistema disponibiliza essa informação.
  */

  const masculineHints = [
    "daniel",
    "felipe",
    "ricardo",
    "jorge",
    "lucas",
    "thiago",
    "brasil",
    "male"
  ];

  const masculine = ptBR.find(v =>
    masculineHints.some(h =>
      v.name.toLowerCase().includes(h)
    )
  );

  return masculine || ptBR[0];
}


function speak(text){

  if(!text || !("speechSynthesis" in window)){
    return;
  }

  speechSynthesis.cancel();

  const clean = String(text)
    .replace(/\*/g,"")
    .replace(/#/g,"")
    .replace(/```/g,"")
    .trim();

  const utterance =
    new SpeechSynthesisUtterance(clean);

  const voice = getBrazilVoice();

  if(voice){
    utterance.voice = voice;
  }

  utterance.lang = "pt-BR";

  /*
    Estilo JARVIS:
    mais controlado, pausado e grave.
  */

  utterance.rate = 0.88;
  utterance.pitch = 0.78;
  utterance.volume = 1;

  utterance.onstart = () => {
    state.speaking = true;
    $("status").textContent = "JARVIS FALANDO";
    $("orb").classList.add("listening");
  };

  utterance.onend = () => {
    state.speaking = false;
    $("status").textContent = "SISTEMA PRONTO";
    $("orb").classList.remove("listening");
  };

  utterance.onerror = () => {
    state.speaking = false;
    $("status").textContent = "VOZ INDISPONÍVEL";
    $("orb").classList.remove("listening");
  };

  speechSynthesis.speak(utterance);
}


/* =========================
   TESTE DA VOZ
========================= */

$("voiceBtn").addEventListener("click", () => {

  const name =
    state.userName || "senhor";

  speak(
    `Boa noite
